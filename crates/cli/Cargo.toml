[package]
name = "reqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqlite-engine = { version = "0.0.1", path = "../engine" }
reqlite-format = { version = "0.0.1", path = "../format" }
reqlite-import = { version = "0.0.1", path = "../import" }
reqlite-secrets = { version = "0.0.1", path = "../secrets" }
reqlite-store = { version = "0.0.1", path = "../store" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rpassword = "7.5.4"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["rt", "net"] }
hyper = { version = "1.11.1", features = ["server", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "http2", "tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
serde_json = "1.0.151"
tempfile = "3.27"

[lints]
workspace = true
