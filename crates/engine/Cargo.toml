[package]
name = "reqlite-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqlite-format = { version = "0.0.1", path = "../format" }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "multipart", "query", "rustls", "stream"] }
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "time"] }
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"

[dev-dependencies]
reqlite-format = { version = "0.0.1", path = "../format" }
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "macros", "time"] }

[lints]
workspace = true
