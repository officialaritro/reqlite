[package]
name = "reqlite-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqlite-format = { version = "0.0.1", path = "../format" }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "multipart", "query", "rustls", "stream"] }
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "sync", "time"] }
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
hyper = { version = "1.11.1", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http2", "aws-lc-rs", "tls12"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
prost = "0.14.4"
prost-types = "0.14.4"

[dev-dependencies]
reqlite-format = { version = "0.0.1", path = "../format" }
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "macros", "time"] }
hyper = { version = "1.11.1", features = ["server", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "http2", "tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
bytes = "1.12.1"
prost = "0.14.4"
prost-reflect = "0.16.5"
protox = "0.10.0"
futures-util = "0.3.34"
tempfile = "3.27"

[lints]
workspace = true
