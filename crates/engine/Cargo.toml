[package]
name = "reqlite-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqlite-format = { version = "0.0.1", path = "../format" }
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "query", "rustls", "stream"] }
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["fs"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "macros", "time"] }

[lints]
workspace = true
