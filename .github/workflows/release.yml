name: Release

# A tag vX.Y.Z builds every platform and makes a draft GitHub Release, which a
# person reads and publishes. A pull request that changes the packaging runs
# the same builds as a dry run and keeps the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.py
      - scripts/macos-app.sh

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/package.py --check-tag "${{ github.ref_name }}"
      - name: Build, package and check
        run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: reqlite-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --draft --generate-notes
          --title "Reqlite ${{ github.ref_name }}"
