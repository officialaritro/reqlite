[package]
name = "reqlite-spike-iced"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqlite-format = { path = "../../crates/format" }
reqlite-engine = { path = "../../crates/engine" }
reqlite-viewer = { path = "../../crates/viewer" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
